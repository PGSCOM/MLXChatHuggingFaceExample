name: Build unsigned MLXChatExample .ipa

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Xcode 26 no longer bundles the Metal compiler; mlx-swift needs it to build its
      # kernels. Ignore failure: some runner images already have it preinstalled.
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Cache resolved Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('mlx-swift-examples.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Build (unsigned, Release, generic iOS device)
        run: |
          xcodebuild build \
            -project mlx-swift-examples.xcodeproj \
            -scheme MLXChatExample \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          app="build/Build/Products/Release-iphoneos/MLXChatExample.app"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry MLXChatHuggingFace-unsigned.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: MLXChatHuggingFace-unsigned
          path: MLXChatHuggingFace-unsigned.ipa
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            MLXChatHuggingFace-unsigned.ipa \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
